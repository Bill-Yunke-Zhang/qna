stages:
  - lint
  - test
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# ── Style checks ──────────────────────────────────────────────────────────────

python-lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    # Pinned so a future ruff release with new rules can't suddenly fail every MR
    - pip install "ruff==0.15.21" --quiet
  script:
    - ruff check backend/ scripts/
    - ruff format --check backend/ scripts/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

frontend-typecheck:
  stage: lint
  image: node:20
  script:
    - npm install --prefix frontend/student
    - npm install --prefix frontend/staff
    - npm install --prefix frontend/admin
    - (cd frontend/student && npx tsc --noEmit)
    - (cd frontend/staff   && npx tsc --noEmit)
    - (cd frontend/admin   && npx tsc --noEmit)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── Unit tests ────────────────────────────────────────────────────────────────

# No services needed. Includes test_profile_hashes_pinned, which fails the MR
# if an ingestion profile changes under its own name (docs/design-rag.md §6.2).
python-unit-tests:
  stage: test
  image: python:3.12-slim
  variables:
    # Same pinned file as backend/Dockerfile, so the chunk-size tests run
    # against MiniLM's real tokenizer instead of being skipped.
    CHUNK_TOKENIZER_PATH: /tmp/minilm/tokenizer.json
  before_script:
    - pip install -r backend/requirements.txt --quiet
    - mkdir -p /tmp/minilm
    - python -c "import urllib.request; urllib.request.urlretrieve('https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/tokenizer.json', '/tmp/minilm/tokenizer.json')"
    - echo "be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037  /tmp/minilm/tokenizer.json" | sha256sum -c -
  script:
    - cd tests/unit && pytest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── Security scans ────────────────────────────────────────────────────────────

sast:
  stage: test

secret_detection:
  stage: secret-detection
